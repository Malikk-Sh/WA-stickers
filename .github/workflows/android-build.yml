name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enforce runtime reflection boundary
        run: |
          violations="$(grep -R -n -E 'java\.lang\.reflect|setAccessible\(|getDeclared(Field|Method|Constructor)\(' \
            app/src/main/java --include='*.java' \
            | grep -v '/MainActivityRuntimeAccess.java:' || true)"
          if [ -n "$violations" ]; then
            echo "Reflection outside MainActivityRuntimeAccess is not allowed:"
            echo "$violations"
            exit 1
          fi

      - name: Enforce redesigned UI color tokens
        run: |
          files=(
            app/src/main/java/com/malikksh/wastickers/AppShellActivity.java
            app/src/main/java/com/malikksh/wastickers/MediaGridPanel.java
            app/src/main/java/com/malikksh/wastickers/BuildPanel.java
            app/src/main/java/com/malikksh/wastickers/PacksPanel.java
            app/src/main/java/com/malikksh/wastickers/SettingsActivity.java
            app/src/main/java/com/malikksh/wastickers/SettingsShellActivity.java
            app/src/main/java/com/malikksh/wastickers/VideoTrimActivity.java
          )
          violations="$(grep -n -E 'Color\.WHITE|Color\.BLACK|0xFF25D366|0xFF128C7E|0xFF075E54' "${files[@]}" || true)"
          if [ -n "$violations" ]; then
            echo "Hardcoded colors are not allowed in redesigned screen code:"
            echo "$violations"
            exit 1
          fi

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Stickers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            adb shell settings put system screen_off_timeout 2147483647 || true
            sleep 2
            gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
