name: Normalize launcher PNGs

on:
  push:
    branches: [ release-prep-1.6 ]
    paths:
      - .github/workflows/reencode-launcher-assets.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: release-prep-1.6

      - name: Normalize PNG encoding
        run: |
          cat >/tmp/ReencodePng.java <<'JAVA'
          import java.awt.Graphics2D;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public class ReencodePng {
              public static void main(String[] args) throws Exception {
                  for (String path : args) {
                      File file = new File(path);
                      BufferedImage source = ImageIO.read(file);
                      if (source == null) throw new IllegalStateException("ImageIO could not decode " + path);
                      BufferedImage normalized = new BufferedImage(
                              source.getWidth(), source.getHeight(), BufferedImage.TYPE_INT_ARGB);
                      Graphics2D graphics = normalized.createGraphics();
                      graphics.drawImage(source, 0, 0, null);
                      graphics.dispose();
                      if (!ImageIO.write(normalized, "png", file)) {
                          throw new IllegalStateException("ImageIO could not encode " + path);
                      }
                      System.out.println(path + " -> " + normalized.getWidth() + "x" + normalized.getHeight());
                  }
              }
          }
          JAVA
          java /tmp/ReencodePng.java \
            app/src/main/res/drawable-nodpi/ic_launcher_adaptive.png \
            app/src/main/res/drawable-nodpi/ic_launcher_legacy.png
          file app/src/main/res/drawable-nodpi/ic_launcher_adaptive.png
          file app/src/main/res/drawable-nodpi/ic_launcher_legacy.png

      - name: Commit normalized assets and remove one-shot workflow
        run: |
          rm .github/workflows/reencode-launcher-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/ic_launcher_adaptive.png \
                  app/src/main/res/drawable-nodpi/ic_launcher_legacy.png \
                  .github/workflows/reencode-launcher-assets.yml
          if git diff --cached --quiet; then
            echo "No launcher asset changes were produced"
            exit 1
          fi
          git commit -m "Normalize launcher PNG resources"
          git push origin HEAD:release-prep-1.6
