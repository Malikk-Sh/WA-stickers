name: Editor state owner migration

on:
  push:
    branches: [ editor-state-owner ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: editor-state-owner

      - name: Apply editor state migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/editor_state_owner_migration.py')
          text = path.read_text()
          text = text.replace(r'r"editorState\.isAnimated\(\)\s*="', r'r"editorState\.isAnimated\(\)\s*=(?!=)"')
          text = text.replace(r'r"editorState\.cover\(\)\s*="', r'r"editorState\.cover\(\)\s*=(?!=)"')
          text = text.replace(r'r"editorState\.drafts\(\)\s*="', r'r"editorState\.drafts\(\)\s*=(?!=)"')
          path.write_text(text)
          PY
          python tools/editor_state_owner_migration.py

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/malikksh/wastickers/MainActivity.java
          git diff --cached --check
          git commit -m "Move editor runtime state out of MainActivity"
          git push origin HEAD:editor-state-owner
