name: Remove runtime access facade

on:
  push:
    branches: [ remove-runtime-access-facade ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout facade-removal branch
        uses: actions/checkout@v4
        with:
          ref: remove-runtime-access-facade

      - name: Migrate callers to direct typed runtime surface
        run: python tools/remove_runtime_access_facade.py

      - name: Commit migrated callers and remove facade/tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git rm app/src/main/java/com/malikksh/wastickers/MainActivityRuntimeAccess.java
          git rm tools/remove_runtime_access_facade.py
          git rm .github/workflows/remove-runtime-access-facade.yml
          git diff --cached --check
          git commit -m "Remove MainActivity runtime access facade"
          git push origin HEAD:remove-runtime-access-facade
