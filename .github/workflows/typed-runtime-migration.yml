name: Typed runtime migration

on:
  push:
    branches: [ post-merge-shell-cleanup ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: post-merge-shell-cleanup

      - name: Apply typed runtime migration
        run: python tools/typed_runtime_migration.py

      - name: Commit migrated sources
        run: |
          rm .github/workflows/typed-runtime-migration.yml
          rm tools/typed_runtime_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace runtime reflection with typed access"
          git push origin HEAD:post-merge-shell-cleanup
